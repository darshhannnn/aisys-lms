[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisys-lms"
version = "0.1.0"
description = "AISYS RFID-Enabled Library Management System — Candidate Prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "aiofiles==24.1.0",

    # Database & ORM
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "aiosqlite==0.20.0",     # SQLite async driver

    # Auth & security
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "itsdangerous==2.2.0",

    # Config & environment
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",

    # Search (full-text via PostgreSQL tsvector — no extra service needed)
    # Notifications / adapters (provider-neutral)
    "httpx==0.27.2",         # async HTTP for ILMS/RFID mock calls
    "jinja2==3.1.4",         # email template rendering (reuse)

    # Logging & observability
    "structlog==24.4.0",

    # Data migration / spreadsheet import
    "openpyxl==3.1.5",

    # Utilities
    "python-dateutil==2.9.0",
    "typer==0.12.5",          # CLI for migration & admin commands
    "rich==13.8.1",           # pretty CLI output
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",          # TestClient
    "factory-boy==3.3.1",
    "faker==30.1.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-python-dateutil",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "migrations*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]
